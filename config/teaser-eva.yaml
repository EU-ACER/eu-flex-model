# Contributors to EU-Wide Flexibility Needs Assessment Model of the Future European Energy System
#
# The economic viability assessment of the ACER paper "Preparing for the
# European flexibility needs assessment" (2026), on the same model as
# config/teaser.yaml: the capacities are iterated for up to 30 iterations, with
# a coarse first step that decays linearly, before the flexibility indicators
# are computed.

run:
  name: teaser-eva
  keep_files: true  # keep the intermediate networks

scenario:
  ty: [2030]
  cy: [2013]

eva:
  sensitivity: true
  max_it: 30
  capacity_update:
    threshold: 20000
    increment: 3000
    linear_decay_iterations: 20
    linear_decay_min_step: 100
  build_network:
    sensitivity_path: data/teaser/ty_{ty}_cy_{cy}
    forecast_timeseries_source: csv
    forecast_p_max_pu_path: data/teaser/ty_2030_cy_2013/generators-p_max_pu-forecast.csv
    forecast_p_set_path: data/teaser/ty_2030_cy_2013/loads-p_set-forecast.csv
  short_term_requirements:
    method: simulation
  dummy_storage_optimization:
    enable: false
  storage_planning:
    po_resolution: 4h
  ramping_shortfall:
    enable: false

solving:
  solver_options:
    highs-default:
      ipm_optimality_tolerance: 1e-6
