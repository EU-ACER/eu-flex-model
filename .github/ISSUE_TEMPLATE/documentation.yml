name: Documentation Feedback
description: Provide feedback on the README or User Manual
title: "[Documentation] "
labels: ["documentation"]
body:
- type: markdown
  attributes:
    value: |
      ## User Manual and README Feedback
      Thank you for helping us improve the EU-Flex model documentation. Please provide feedback on the README or User Manual.

      > **⚠️ Note: This template is for feedback on the README and User Manual only**
      > For feedback on the **Modelling Specification** (methodology, equations, indicators), please use the ACER survey mechanism communicated separately.

      > **⚠️ Feedback deadline: December 17, 2026**
      > This deadline mirrors ACER's public consultation period (November 5 - December 17, 2026).
      > Issues submitted after this date will not be considered for this release cycle.

      > **📋 How feedback will be handled:**
      >
      > Please note that **only severe bug or error reports preventing users to install and run the model will be addressed as soon as feasible**. All other feedback will be collected and reviewed by ACER. A summary of the feedback collected and how ACER has addressed it will be provided in the EU-wide FNA report, planned to be published in **July 2027**.

- type: dropdown
  id: documentation_type
  attributes:
    label: Documentation type
    description: Which documentation are you providing feedback on?
    options:
    - "README"
    - "User Manual"
    - "Other"
  validations:
    required: true

- type: dropdown
  id: feedback_type
  attributes:
    label: Type of feedback
    description: What kind of feedback are you providing?
    options:
    - "Unclear / Confusing"
    - "Missing Information"
    - "Incorrect Information"
    - "Suggestion for Improvement"
    - "Formatting / Readability"
    - "Other"
  validations:
    required: true

- type: textarea
  id: location
  attributes:
    label: Location in documentation
    description: Where in the documentation is this feedback related to?
    placeholder: |
      - File name
      - Section
      - Specific paragraph or heading
  validations:
    required: true

- type: textarea
  id: feedback
  attributes:
    label: Your feedback
    description: Please describe your feedback in detail
    placeholder: |
      What is unclear, missing, or incorrect?
      What would you like to see improved?
  validations:
    required: true
